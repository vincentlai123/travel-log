<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111513">
  <meta name="referrer" content="no-referrer">
  <title>Vincent 旅遊日誌</title>
  <link rel="stylesheet" href="viewer.css">
  <script defer src="viewer.js"></script>
</head>
<body>
  <main class="shell">
    <header><h1><span lang="en">Vincent</span> 旅遊日誌</h1></header>
    <section class="filters" aria-label="篩選收藏">
      <nav id="categories" aria-label="收藏類別"></nav>
      <div class="fields">
        <label class="search">搜尋<input type="search" id="query" placeholder="店名、地區或料理" autocomplete="off"></label>
        <label>地區<select id="zone"></select></label>
        <label>專題<select id="topic"></select></label>
      </div>
    </section>
    <p id="alert" role="status" hidden></p>
    <section class="collection" aria-labelledby="collection-title">
      <div class="line"><h2 id="collection-title">收藏清單</h2><span id="count" aria-live="polite">讀取中…</span></div>
      <table id="table" hidden>
        <thead><tr><th scope="col">名稱</th><th scope="col" class="category">類別</th><th scope="col" class="region">地區</th><th scope="col" class="type">類型</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" hidden></p>
      <button id="reset" type="button" hidden>清除篩選</button>
      <button id="retry" type="button" hidden>重新讀取</button>
    </section>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-top"><p id="detail-kind"></p><button id="close" type="button" autofocus>關閉</button></div>
    <h2 id="detail-title"></h2>
    <div id="detail-body"></div>
  </dialog>
</body>
</html>
